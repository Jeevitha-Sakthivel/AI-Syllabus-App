name: AI
description: A Flutter AI Syllabus Application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^7.2.2
  cupertino_icons: ^1.0.2
  syncfusion_flutter_pdfviewer: ^31.1.18
  provider: ^6.0.5

flutter_tts: ^3.8.3
url_launcher: ^6.3.0




flutter:
  uses-material-design: true

  assets:
    - assets/images/girl.png
    - assets/logo/logo.png
    - assets/pdfs/additional_questions.pdf
    - assets/pdfs/anna_university.pdf
    - assets/pdfs/unit1.pdf
    - assets/pdfs/unit2.pdf
    - assets/pdfs/unit3.pdf
    - assets/pdfs/unit4.pdf
    - assets/pdfs/unit5.pdf

dev_dependencies:
  flutter_launcher_icons: ^0.10.0



flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
